{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Éxito - UNEFA</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: url("{% static 'img/fondo_venezuela.png' %}") no-repeat center center fixed;
            background-size: cover;
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .caja-exito {
            background: rgba(0, 51, 102, 0.92);
            backdrop-filter: blur(2px);
            padding: clamp(30px, 6vw, 45px) clamp(20px, 5vw, 40px);
            border-radius: 30px;
            border: 2px solid rgba(255, 215, 0, 0.6);
            width: 100%;
            max-width: 500px;
            text-align: center;
            color: white;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 20px rgba(255,215,0,0.2);
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-unefa {
            width: clamp(70px, 20vw, 90px);
            margin-bottom: 15px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        h2 {
            color: #FFD700;
            font-size: clamp(1.4rem, 5vw, 1.8rem);
            font-weight: 700;
            text-transform: uppercase;
            margin: 0 0 15px 0;
            letter-spacing: 2px;
        }

        .mensaje-exito {
            color: white;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .boton-dorado {
            display: inline-block;
            background: #FFD700;
            color: #003366;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            padding: 14px 20px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
        }

        .boton-dorado:hover {
            background: #e6c200;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* Responsive */
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            .caja-exito {
                padding: 25px 20px;
            }
            .boton-dorado {
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="caja-exito">
        <img src="{% static 'img/logo_unefa.png' %}" class="logo-unefa" alt="UNEFA">
        <h2>¡ÉXITO!</h2>
        <p class="mensaje-exito">Contraseña restablecida correctamente.<br>Ya puedes iniciar sesión con tu nueva clave institucional.</p>
        <a href="{% url 'login' %}" class="boton-dorado">INICIAR SESIÓN</a>
    </div>
</body>
</html>
