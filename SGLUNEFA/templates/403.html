{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso Denegado - UNEFA</title>
    <style>
        body {
            background: url("{% static 'img/fondo_venezuela.png' %}") no-repeat center center fixed;
            background-size: cover;
            display: flex; align-items: center; justify-content: center;
            height: 100vh; margin: 0; font-family: 'Segoe UI', sans-serif;
        }
        .caja-error {
            background: rgba(17, 17, 17, 0.95);
            padding: 40px; border-radius: 15px; border: 2px solid #ff4d4d;
            text-align: center; color: white; max-width: 450px;
            box-shadow: 0 15px 35px rgba(255, 77, 77, 0.3);
        }
        h1 { color: #ff4d4d; text-transform: uppercase; font-size: 1.8rem; margin-bottom: 10px; }
        p { color: #ccc; line-height: 1.5; margin-bottom: 25px; }
        .btn-volver {
            background: #FFD700; color: #003366; padding: 12px 25px;
            text-decoration: none; border-radius: 8px; font-weight: bold;
            text-transform: uppercase; transition: 0.3s;
        }
        .btn-volver:hover { background: #e6c200; }
    </style>
</head>
<body>
    <div class="caja-error">
        <img src="{% static 'img/logo_unefa.png' %}" width="90" alt="UNEFA">
        <h1>Acceso Restringido</h1>
        <p>Lo sentimos, su cuenta de <strong>Docente</strong> no tiene permisos para acceder a este módulo administrativo.</p>
        <a href="{% url 'dashboard' %}" class="btn-volver">Regresar al Sistema</a>
    </div>
</body>
</html>
