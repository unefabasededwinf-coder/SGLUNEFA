{% extends "admin/login.html" %}
{% load static %}

{% block extrastyle %}
{{ block.super }}
<style>
    /* 1. Fondo y bloqueo de scroll */
    html, body {
        height: 100% !important;
        overflow: hidden !important;
        margin: 0 !important;
        padding: 0 !important;
    }

    body {
        background-image: url("{% static 'img/fondo_venezuela.png' %}") !important;
        background-size: cover !important;
        background-position: center !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
    }

    /* 2. Limpieza de contenedores originales de Django */
    #content { padding: 0 !important; background: none !important; }
    .login #container {
        background: none !important;
        border: none !important;
        box-shadow: none !important;
        margin: 0 !important;
        width: 100% !important;
        max-width: 300px !important; /* Reducido de 340px a 300px */
    }

    /* 3. Caja compacta */
    .caja-unefa-real {
        background: #111 !important;
        border-radius: 10px !important;
        overflow: hidden !important;
        box-shadow: 0 10px 30px rgba(0,0,0,0.8) !important;
        border: 1px solid #333 !important;
    }

    /* 4. Cabecera más compacta */
    .unefa-header-block {
        background: #003366 !important;
        padding: 12px 8px !important; /* reducido de 15px 10px */
        text-align: center !important;
        border-bottom: 3px solid #FFD700 !important;
    }

    .unefa-logo {
        max-width: 70px !important; /* reducido de 85px */
        height: auto !important;
        margin-bottom: 6px !important; /* reducido */
    }

    .unefa-title {
        color: #FFD700 !important;
        font-size: 0.9rem !important; /* ligeramente más pequeño */
        font-weight: bold !important;
        text-transform: uppercase;
        margin: 0 !important;
        line-height: 1.2;
    }

    /* 5. Formulario más compacto */
    .form-content {
        padding: 12px 20px !important; /* reducido de 15px 25px */
    }

    .form-row {
        margin-bottom: 8px !important; /* reducido de 10px */
        border: none !important;
        padding: 0 !important;
    }

    label {
        color: #ccc !important;
        font-size: 0.8rem !important; /* reducido */
        margin-bottom: 2px !important;
        display: block !important;
        float: none !important;
        width: auto !important;
    }

    input[type="text"], input[type="password"] {
        background: #222 !important;
        border: 1px solid #444 !important;
        color: white !important;
        padding: 8px !important; /* reducido de 10px */
        border-radius: 4px !important;
        width: 100% !important;
        box-sizing: border-box;
        font-size: 0.85rem !important;
    }

    .submit-row {
        padding: 8px 0 0 0 !important; /* reducido */
        margin: 0 !important;
        background: none !important;
        border: none !important;
    }

    .submit-row input {
        background: #FFD700 !important;
        color: #003366 !important;
        font-weight: bold !important;
        padding: 10px !important; /* reducido de 12px */
        border: none !important;
        border-radius: 6px !important;
        cursor: pointer !important;
        width: 100% !important;
        text-transform: uppercase;
        font-size: 0.85rem !important;
    }

    .footer-links {
        text-align: center;
        padding: 0 20px 15px !important; /* reducido */
    }

    .password-recovery-link, .register-link {
        display: block;
        color: #FFD700 !important;
        text-decoration: none;
        font-size: 0.7rem !important; /* reducido */
        margin-top: 6px !important; /* reducido */
    }

    /* Ocultar elementos sobrantes del admin */
    #header, .breadcrumbs, .submit-row br, #footer { display: none !important; }
</style>
{% endblock %}

{% block content %}
<div class="caja-unefa-real">
    <div class="unefa-header-block">
        <img src="{% static 'img/logo_unefa.png' %}" alt="Logo UNEFA" class="unefa-logo">
        <p class="unefa-title">SGL UNEFA Extension PF</p>
    </div>

    <div class="form-content">
        <form action="{{ app_path }}" method="post" id="login-form">
            {% csrf_token %}
            <div class="form-row">
                <label>Usuario:</label>
                <input type="text" name="username" required>
            </div>
            <div class="form-row">
                <label>Contraseña:</label>
                <input type="password" name="password" required>
            </div>
            <div class="submit-row">
                <input type="submit" value="ACCESO">
            </div>
        </form>
    </div>
         <div class="footer-links">
             <!-- LOS BOTONES DE CREAR ADMINISTRADOR Y RECUPERAR CONTRASEÑA ESTAN COMENTADOS PARA QUE NO SE VEAN
             <a href="{% url 'registro' %}" class="register-link">No tienes cuenta? Registrate aquí</a>
             <a href="{% url 'reset_password' %}" class="password-recovery-link">Olvidaste tu contraseña?</a>
             -->
        </div>
</div>
{% endblock %}
