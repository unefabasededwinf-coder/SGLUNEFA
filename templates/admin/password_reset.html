{% extends "admin/login.html" %}
{% load static %}

{% block extrastyle %}
{{ block.super }}
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    /* Reset y base */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        height: 100%;
        margin: 0;
        padding: 0;
    }

    body {
        background-image: url("{% static 'img/fondo_venezuela.png' %}") !important;
        background-size: cover !important;
        background-position: center !important;
        background-attachment: fixed !important;
        font-family: 'Poppins', sans-serif !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        padding: 16px !important;
        min-height: 100vh !important;
    }

    /* Ocultar elementos originales de Django admin */
    #header, .breadcrumbs, #footer, .submit-row br {
        display: none !important;
    }

    #content {
        padding: 0 !important;
        background: none !important;
    }

    .login #container {
        background: none !important;
        border: none !important;
        box-shadow: none !important;
        margin: 0 !important;
        width: 100% !important;
        max-width: 450px !important;
        padding: 0 !important;
    }

    /* Contenedor principal estilo tarjeta */
    .caja-unefa-real {
        background: rgba(0, 51, 102, 0.92) !important;
        backdrop-filter: blur(2px);
        border-radius: 30px !important;
        overflow: hidden !important;
        box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 20px rgba(255,215,0,0.2) !important;
        border: 2px solid rgba(255, 215, 0, 0.6) !important;
        width: 100%;
        animation: fadeInUp 0.8s ease-out;
    }

    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* Cabecera */
    .unefa-header-block {
        background: rgba(0, 51, 102, 0.8) !important;
        padding: clamp(20px, 5vw, 30px) clamp(15px, 4vw, 25px) !important;
        text-align: center !important;
        border-bottom: 3px solid #FFD700 !important;
    }

    .unefa-title {
        color: #FFD700 !important;
        font-size: clamp(1.3rem, 5vw, 1.8rem) !important;
        font-weight: 700 !important;
        text-transform: uppercase;
        margin: 0 !important;
        letter-spacing: 2px;
    }

    /* Contenido del formulario */
    .form-content {
        padding: clamp(20px, 6vw, 30px) clamp(20px, 5vw, 30px) !important;
        text-align: center;
    }

    .form-content p {
        color: rgba(255,255,255,0.85) !important;
        font-size: 0.85rem !important;
        margin-bottom: 25px !important;
        line-height: 1.4;
    }

    .form-row {
        margin-bottom: 20px !important;
        border: none !important;
        padding: 0 !important;
    }

    label {
        color: #FFD700 !important;
        font-size: 0.85rem !important;
        font-weight: 500 !important;
        margin-bottom: 8px !important;
        display: block !important;
        float: none !important;
        width: auto !important;
        text-align: left;
    }

    input[type="email"] {
        background: rgba(255, 255, 255, 0.1) !important;
        border: 1px solid rgba(255, 215, 0, 0.5) !important;
        color: white !important;
        padding: 12px !important;
        border-radius: 12px !important;
        width: 100% !important;
        box-sizing: border-box !important;
        font-size: 1rem !important;
        transition: all 0.3s ease;
    }

    input[type="email"]:focus {
        outline: none !important;
        border-color: #FFD700 !important;
        box-shadow: 0 0 8px rgba(255, 215, 0, 0.4) !important;
        background: rgba(255, 255, 255, 0.15) !important;
    }

    .submit-row {
        padding: 10px 0 0 0 !important;
        margin: 0 !important;
        background: none !important;
        border: none !important;
    }

    .submit-row input {
        background: #FFD700 !important;
        color: #003366 !important;
        font-weight: bold !important;
        font-size: 1rem !important;
        padding: 14px !important;
        border: none !important;
        border-radius: 12px !important;
        cursor: pointer !important;
        width: 100% !important;
        text-transform: uppercase;
        transition: all 0.3s ease;
        letter-spacing: 1px;
    }

    .submit-row input:hover {
        background: #e6c200 !important;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .password-recovery-link {
        display: inline-block;
        margin-top: 20px;
        color: #FFD700 !important;
        text-decoration: none;
        font-size: 0.8rem;
        transition: 0.2s;
    }

    .password-recovery-link:hover {
        text-decoration: underline;
        color: #ffea80 !important;
    }

    /* Responsive */
    @media (max-width: 480px) {
        body {
            padding: 10px !important;
        }
        .login #container {
            max-width: 100% !important;
        }
        .caja-unefa-real {
            border-radius: 24px !important;
        }
        .form-content {
            padding: 20px !important;
        }
        input[type="email"] {
            padding: 10px !important;
        }
        .submit-row input {
            padding: 12px !important;
        }
    }

    @media (max-width: 360px) {
        .unefa-title {
            font-size: 1.2rem !important;
        }
        .form-content p {
            font-size: 0.75rem !important;
        }
    }

    /* Orientación horizontal */
    @media (max-width: 700px) and (orientation: landscape) {
        body {
            padding: 12px !important;
        }
        .caja-unefa-real {
            max-width: 500px;
            margin: auto;
        }
        .unefa-header-block {
            padding: 15px !important;
        }
        .form-content {
            padding: 15px 20px !important;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="caja-unefa-real">
    <div class="unefa-header-block">
        <h1 class="unefa-title">Recuperar Clave</h1>
    </div>
    <div class="form-content">
        <p>Escribe tu correo institucional para enviarte las instrucciones.</p>
        <form method="post">
            {% csrf_token %}
            <div class="form-row">
                <label>Correo electrónico:</label>
                {{ form.email }}
            </div>
            <div class="submit-row">
                <input type="submit" value="Enviar Enlace">
            </div>
        </form>
        <a href="{% url 'login' %}" class="password-recovery-link">Volver al inicio</a>
    </div>
</div>
{% endblock %}
