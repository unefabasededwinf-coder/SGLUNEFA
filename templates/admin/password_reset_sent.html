{% extends "admin/login.html" %}
{% load static %}

{% block extrastyle %}
{{ block.super }}
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    /* Reset y base */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        height: 100%;
        margin: 0;
        padding: 0;
    }

    body {
        background-image: url("{% static 'img/fondo_venezuela.png' %}") !important;
        background-size: cover !important;
        background-position: center !important;
        background-attachment: fixed !important;
        font-family: 'Poppins', sans-serif !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        padding: 16px !important;
        min-height: 100vh !important;
    }

    /* Ocultar elementos originales de Django admin */
    #header, .breadcrumbs, #footer {
        display: none !important;
    }

    #content {
        padding: 0 !important;
        background: none !important;
    }

    .login #container {
        background: none !important;
        border: none !important;
        box-shadow: none !important;
        margin: 0 !important;
        width: 100% !important;
        max-width: 450px !important;
        padding: 0 !important;
    }

    /* Contenedor principal estilo tarjeta */
    .caja-unefa-real {
        background: rgba(0, 51, 102, 0.92) !important;
        backdrop-filter: blur(2px);
        border-radius: 30px !important;
        overflow: hidden !important;
        box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 20px rgba(255,215,0,0.2) !important;
        border: 2px solid rgba(255, 215, 0, 0.6) !important;
        width: 100%;
        animation: fadeInUp 0.8s ease-out;
    }

    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* Cabecera */
    .unefa-header-block {
        background: rgba(0, 51, 102, 0.8) !important;
        padding: clamp(20px, 5vw, 30px) !important;
        text-align: center !important;
        border-bottom: 3px solid #FFD700 !important;
    }

    .unefa-title {
        color: #FFD700 !important;
        font-size: clamp(1.4rem, 5vw, 2rem) !important;
        font-weight: 700 !important;
        text-transform: uppercase;
        margin: 0 !important;
        letter-spacing: 2px;
    }

    /* Contenido del formulario */
    .form-content {
        padding: clamp(25px, 6vw, 35px) clamp(20px, 5vw, 30px) !important;
        text-align: center;
    }

    .form-content p {
        margin-bottom: 15px;
        line-height: 1.4;
    }

    .mensaje-principal {
        color: white !important;
        font-size: 0.95rem;
        font-weight: 500;
    }

    .mensaje-spam {
        color: #FFD700 !important;
        font-size: 0.85rem;
        margin-top: 5px;
    }

    .submit-row {
        padding: 15px 0 0 0 !important;
        margin: 0 !important;
        background: none !important;
        border: none !important;
    }

    .submit-row input {
        background: #FFD700 !important;
        color: #003366 !important;
        font-weight: bold !important;
        font-size: 1rem !important;
        padding: 14px !important;
        border: none !important;
        border-radius: 12px !important;
        cursor: pointer !important;
        width: 100% !important;
        text-transform: uppercase;
        transition: all 0.3s ease;
        letter-spacing: 1px;
    }

    .submit-row input:hover {
        background: #e6c200 !important;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    /* Responsive */
    @media (max-width: 480px) {
        body {
            padding: 10px !important;
        }
        .login #container {
            max-width: 100% !important;
        }
        .caja-unefa-real {
            border-radius: 24px !important;
        }
        .form-content {
            padding: 20px !important;
        }
        .submit-row input {
            padding: 12px !important;
        }
    }

    @media (max-width: 360px) {
        .unefa-title {
            font-size: 1.2rem !important;
        }
        .mensaje-principal {
            font-size: 0.85rem;
        }
        .mensaje-spam {
            font-size: 0.75rem;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="caja-unefa-real">
    <div class="unefa-header-block">
        <h1 class="unefa-title">Correo Enviado</h1>
    </div>
    <div class="form-content">
        <p class="mensaje-principal">Hemos enviado un enlace a tu bandeja de entrada.</p>
        <p class="mensaje-spam">Si no aparece, revisa la carpeta de SPAM.</p>
        <div class="submit-row">
            <a href="{% url 'login' %}" style="text-decoration: none;">
                <input type="button" value="Entendido">
            </a>
        </div>
    </div>
</div>
{% endblock %}
